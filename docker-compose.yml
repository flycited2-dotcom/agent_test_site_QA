services:
  qa-agent:
    build: .
    container_name: climat-simf-qa-agent
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results
      - ./storage:/app/storage
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    stop_grace_period: 120s
    network_mode: host
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    shm_size: "1gb"
    command: bash scripts/start-agent.sh
