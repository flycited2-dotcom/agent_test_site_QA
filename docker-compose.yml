services:
  qa-agent:
    build: .
    container_name: climat-simf-qa-agent
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results
      - ./storage:/app/storage
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    network_mode: host
    shm_size: "1gb"
    command: bash -lc "npm run qa:bot & bash scripts/agent-loop.sh"
